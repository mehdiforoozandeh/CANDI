encoder:
  num_assays: 8
  context_length: 768
  metadata_embed_dim: 32
  meta_embed_layernorm: true
  n_cnn_layers: 3
  expansion_factor: 2
  conv_kernel_size: 3
  pool_size: 2
  conv_norm: layer
  dna_pool_size: 5
  dna_pool_order: late
  film_mode: per_conv_and_transformer
  missing_data_mode: mask_token
  fusion_mode: linear
  fusion_norm: none
  d_model: 0
  n_transformer_layers: 2
  nhead: 4
  transformer_type: xtransformers
  dropout: 0.1
  signal_transform: log1p
decoder:
  heads: count_peak
  trunk: shared
  film_mode: single_pre_decoder
  meta_embed_dim: 32
  meta_embed_layernorm: false
  n_cnn_layers: 3
  expansion_factor: 2
  pool_size: 2
  conv_kernel_size: 3
  norm: layer
  grouped_deconv: false
  gaussian_var_min: 0.1
data:
  h5_path: sandbox/data/sandbox.h5
  regime: type2_loci
  context_length: 768
  resolution: 25
  signal_transform: arcsinh
  num_workers: 0
  region_stratified_loss: true
  h5_cache_ram: true
  ram_cache_max_bytes: 10737418240
training:
  epochs: 10
  batch_size: 8
  grad_accum_steps: 1
  seed: 42
  strict_determinism: false
  device: null
  run_dir: .
  amp: false
  augment_reverse_complement_prob: 0.0
  max_train_batches: null
  eval_each_epoch: true
  eval_max_batches: 0
  steps_per_epoch: 0
  training_stats_jsonl_every_n_steps: 50
  save_checkpoint: false
  save_best_checkpoint: false
  best_checkpoint_cooldown_epochs: 20
  early_stop_enabled: false
  early_stop_patience: 5
  optimizer:
    name: adamax
    adam:
      lr: 0.001
      beta1: 0.9
      beta2: 0.999
      eps: 0.001
      weight_decay: 0.0
      amsgrad: false
    adamw:
      lr: 0.0003
      beta1: 0.9
      beta2: 0.999
      eps: 0.001
      weight_decay: 0.01
      amsgrad: false
    adamax:
      lr: 0.001
      beta1: 0.9
      beta2: 0.999
      eps: 0.001
      weight_decay: 0.0
    sgd:
      lr: 0.01
      momentum: 0.9
      dampening: 0.0
      weight_decay: 0.0
      nesterov: false
  schedule:
    name: cosine
    warmup_frac: 0.1
    min_lr_ratio: 0.1
  grad:
    clip_norm: 2.0
    clip_mode: norm
    clip_log_window: 100
  masking:
    p_full_assay: 0.8
    p_full_loci: 0.5
    p_chunks: 0.0
    mask_fraction: 0.2
    chunk_size: 40
    min_available_frac: 0.0
    preserve_assay_id: true
  loss_weights:
    count_weight: 1.0
    pval_weight: 1.0
    peak_weight: 1.0
    obs_weight: 1.0
    imp_weight: 1.0
  dsf:
    dsf_list:
    - 1
    - 2
    - 4
    - 8
    sampling: uniform
    eval_dsf: '1'
eval:
  eic_metadata_path: data/eic_metadata.csv
  use_canonical_missing_meta: true
  meta_sensitivity_probe_every_n_steps: 200
  probe_depth_lo: 22
  probe_depth_hi: 24
  probe_read_length_lo: 36
  probe_read_length_hi: 100
  probe_run_types:
  - 0
  - 1
  probe_num_windows: 16
  eval_every_n_epochs: 1
  eval_imp_prefixes:
  - V_
  - B_
wandb:
  project: candi_sandbox
  entity: null
  mode: disabled
  run_name: null
  tags: []
hpo:
  parent: []
  experiment_label: ''
  notes: ''
  disable: true
  graph_path: sandbox/hpo_graph.json
