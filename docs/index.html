<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANDI — graphical abstract</title>
<meta name="description" content="CANDI: self-supervised and confidence-aware denoising imputation of genomic data.">
<style>
  :root { --bg: #FBFAF8; --muted: #6B7A83; --rule: #E2DDD5; --teal: #12868C; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11171B; --muted: #8FA0A9; --rule: #2A343A; --teal: #3FB6BC; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px 16px;
  }
  /* The figure is the page. It gets the whole viewport minus the link strip,
     and scales to whichever dimension runs out first. */
  img {
    display: block; width: 100%; max-width: 1500px; height: auto;
    max-height: calc(100vh - 76px); object-fit: contain;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: 8px;
  }
  nav {
    margin-top: 14px; font-size: 13px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center;
  }
  nav a { color: var(--teal); font-weight: 600; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <img src="candi-graphical-abstract.svg"
       alt="CANDI workflow. Top row: a data tensor of cell types x assays x genome, in
            which one experiment is a thread along the genome and grey threads are missing;
            one cell type is sliced out as an assays-by-genome matrix; a 30 kb window of it
            is magnified into raw read-count tracks, a one-hot DNA strip and the experiment
            covariates, which feed the CANDI encoder-decoder. Bottom row, running back
            leftward: the same window with a predicted mean and 95% interval on every
            track, the same slice with the holes filled, and the same tensor complete.
            Below, three panels of published results: calibrated confidence intervals,
            gene-expression prediction that resists data sparsity, and more reproducible
            chromatin state annotations.">
  <nav>
    <span>CANDI — Foroozandeh, Diab &amp; Libbrecht, Simon Fraser University</span>
    <a href="candi-graphical-abstract.pdf">PDF</a>
    <a href="candi-graphical-abstract.svg">SVG</a>
    <a href="https://github.com/mehdiforoozandeh/CANDI">Code</a>
  </nav>
</body>
</html>
